name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPACY_MODEL: https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl

jobs:
  python:
    name: lint, types, tests (PostgreSQL, CDK)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIRA_TEST_DATABASE_URL: postgresql://lira:lira@localhost:5432/lira_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,infra]" "$SPACY_MODEL"
      - name: Database role that row-level security applies to (not a superuser)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE lira LOGIN PASSWORD 'lira' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE lira_test OWNER lira"
      - name: Ruff
        run: |
          .venv/bin/ruff check src tests infra
          .venv/bin/ruff format --check src tests
      - name: Mypy
        run: .venv/bin/mypy
      - name: Prompts are locked to their regression runs
        run: .venv/bin/lira prompts check
      - name: Tests
        run: .venv/bin/pytest -q --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  text = (bad.get("message") or bad.text or "").replace("\n", " ")[:900]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY

  console:
    name: console (types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  pipeline:
    name: pipeline, release gate, console end-to-end, image
    runs-on: ubuntu-latest
    needs: [python]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIRA_DATABASE_URL: postgresql://lira:lira@localhost:5432/lira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" "$SPACY_MODEL"
      - name: Database role that row-level security applies to (not a superuser)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE lira LOGIN PASSWORD 'lira' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE lira OWNER lira"
      - name: Simulate, train, compile, evaluate, gate
        run: .venv/bin/lira run
      - name: Held-out sets are unchanged since their first runs
        run: |
          .venv/bin/lira heldout run guidelines-lindeveld > /dev/null
          .venv/bin/lira heldout run entries-litigation-1 > /dev/null
          git diff --exit-code -- reports/heldout/*/first_run.json
      - name: Seed the demo database
        run: .venv/bin/lira demo --seed-only
      - name: Console end-to-end
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            reports/eval/
            web/test-results/
          if-no-files-found: ignore
      - name: Build the service image
        run: docker build -f deploy/Dockerfile -t lira:${{ github.sha }} .
