[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lira"
version = "0.1.0"
description = "Legal invoice review agents: outside-counsel invoices checked against each client's billing guidelines, with evaluation, on AWS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6",
  "numpy>=2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "spacy>=3.8,<3.9",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2",
  "langgraph-checkpoint-postgres>=2",
  "psycopg[binary,pool]>=3.2",
  "boto3>=1.35",
  "anthropic>=0.40",
  "opensearch-py>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.27",
  "langfuse>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "moto>=5", "types-PyYAML"]
infra = ["aws-cdk-lib>=2.170", "constructs>=10", "cdk-nag>=2.28"]

[project.scripts]
lira = "lira.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lira = ["prompts/*.yaml", "service/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests", "infra/tests"]
asyncio_mode = "auto"
markers = [
  "slow: builds the simulated world and trains the models (seconds to a minute)",
  "db: needs PostgreSQL (LIRA_TEST_DATABASE_URL)",
  "infra: synthesises the CDK app (needs Node.js)",
]
filterwarnings = ["ignore::DeprecationWarning:jsii.*", "ignore::DeprecationWarning:typeguard.*"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["web", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM108", "RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["lira"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
